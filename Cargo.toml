[workspace]
resolver = "3"
members = [
    "crates/ember-core",
    "crates/ember-macros",
    "crates/ember-servers",
    "crates/ember-render/macroquad",
    "crates/ember-audio/macroquad",
    "crates/ember-input",
    "crates/ember-scene",
    "crates/ember-ui",
    "crates/ember-assets",
    "crates/ember-editor",
    "crates/ember",
    "crates/ember-stdlib",
    "games/*",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ember-core             = { path = "crates/ember-core" }
ember-macros           = { path = "crates/ember-macros" }
ember-servers          = { path = "crates/ember-servers" }
ember-render-macroquad = { path = "crates/ember-render/macroquad" }
ember-audio-macroquad  = { path = "crates/ember-audio/macroquad" }
ember-input            = { path = "crates/ember-input" }
ember-scene            = { path = "crates/ember-scene" }
ember-ui               = { path = "crates/ember-ui" }
ember-assets           = { path = "crates/ember-assets" }
ember-editor           = { path = "crates/ember-editor" }
ember                  = { path = "crates/ember" }
ember-stdlib           = { path = "crates/ember-stdlib" }

# New for ember-macros (its Cargo.toml uses *.workspace = true):
syn         = { version = "2", features = ["full"] }
quote       = "1"
proc-macro2 = "1"

glam   = "0.27"
serde  = { version = "1", features = ["derive"] }
ron    = "0.8"
png    = "0.17"

macroquad = { version = "0.4", features = ["audio"] }
dotenvy   = "0.15"

futures = "0.3"
slotmap = "1"

# Audio decoding is ~30x slower unoptimised; a debug `cargo run` would
# spend seconds decoding music at start (ADR-043). Optimise only the
# decoders, so game code keeps fast debug builds.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.hound]
opt-level = 3
[profile.dev.package.lewton]
opt-level = 3
[profile.dev.package.audrey]
opt-level = 3
[profile.dev.package.quad-snd]
opt-level = 3
