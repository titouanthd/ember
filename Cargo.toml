[workspace]
resolver = "3"
members = [
    "crates/ember-core",
    "crates/ember-stdlib",
    "crates/ember-editor",
    "games/pong",
    "games/breakout",
    "games/snake",
    "games/asteroids", 
    "games/bullet-hell", "games/minesweeper", "games/simon", "games/memory",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# --- Tier 1 : moteur pur ---
glam   = "0.27"
serde  = { version = "1", features = ["derive"] }
ron    = "0.8"

# --- Tier 2 : stdlib (graphique) ---
macroquad = { version = "0.4", features = ["audio"] }
dotenvy   = "0.15"

# --- Crates internes ---
ember-core   = { path = "crates/ember-core" }
ember-stdlib = { path = "crates/ember-stdlib" }
