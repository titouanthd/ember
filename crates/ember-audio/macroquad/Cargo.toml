[package]
name = "ember-audio-macroquad"
version.workspace = true
edition.workspace = true

[dependencies]
ember-core.workspace = true
ember-servers.workspace = true
macroquad.workspace = true
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# quad-snd's own WAV reader, to prove it accepts the WAV mp3.rs writes.
audrey = { version = "0.3", default-features = false, features = ["wav"] }
