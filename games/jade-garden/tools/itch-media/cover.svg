<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" width="630" height="500">
  <defs>
    <radialGradient id="stage" cx="0.5" cy="0.55" r="0.72">
      <stop offset="0%"  stop-color="#1C1712"/>
      <stop offset="65%" stop-color="#0E0B08"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>

    <!-- A: 6-stop gradient, deeper contrast -->
    <linearGradient id="jadeBody" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0%"   stop-color="#C4F7DE"/>
      <stop offset="14%"  stop-color="#7FD9A6"/>
      <stop offset="35%"  stop-color="#4E9D78"/>
      <stop offset="58%"  stop-color="#2A6748"/>
      <stop offset="80%"  stop-color="#123522"/>
      <stop offset="100%" stop-color="#061410"/>
    </linearGradient>

    <radialGradient id="jadeHalo" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0%"  stop-color="#4FB880" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#2A6E4A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2A6E4A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.60"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="specHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- B: bottom rim light gradient -->
    <linearGradient id="bottomRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#A8F0C8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#A8F0C8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A8F0C8" stop-opacity="0.55"/>
    </linearGradient>

    <clipPath id="hexClip">
      <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5"/>
    </clipPath>

    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="630" height="500" fill="url(#stage)"/>

  <!-- Header -->
  <text x="315" y="72" text-anchor="middle"
        font-family="'DejaVu Sans Mono', Menlo, Monaco, monospace"
        font-size="20"
        fill="#D9B96A" letter-spacing="11">JADE GARDEN</text>

  <g opacity="0.7">
    <line x1="198" y1="89" x2="305" y2="89" stroke="#B88A42" stroke-width="0.55"/>
    <line x1="325" y1="89" x2="432" y2="89" stroke="#B88A42" stroke-width="0.55"/>
    <polygon points="315,86 318,89 315,92 312,89" fill="#D9B96A"/>
  </g>

  <text x="315" y="112" text-anchor="middle"
        font-family="'DejaVu Sans Mono', Menlo, Monaco, monospace"
        font-size="9"
        fill="#8A7A62" letter-spacing="6">A CONTEMPLATIVE MATCH-3</text>

  <!-- Halo & contact shadow -->
  <ellipse cx="315" cy="328" rx="205" ry="185" fill="url(#jadeHalo)"/>
  <ellipse cx="315" cy="468" rx="105" ry="9" fill="url(#contact)"/>

  <!-- ═══ JADE: center (315, 328), radius 105 ═══ -->
  <g transform="translate(315 328)">

    <polygon points="0,-108 93.5,-54 93.5,54 0,108 -93.5,54 -93.5,-54"
             fill="#04120C"/>

    <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5"
             fill="url(#jadeBody)"/>

    <!-- Clipped internal effects -->
    <g clip-path="url(#hexClip)">
      <ellipse cx="-32" cy="-44" rx="52" ry="36"
               fill="#E0FBEA" opacity="0.36" filter="url(#blur14)"/>
      <ellipse cx="38" cy="-25" rx="34" ry="25"
               fill="#D0F8E0" opacity="0.14" filter="url(#blur14)"/>
      <ellipse cx="42" cy="52" rx="62" ry="40"
               fill="#020E08" opacity="0.60" filter="url(#blur14)"/>

      <path d="M -85,8 Q -25,-10 18,25 T 85,18"
            fill="none" stroke="#C0F0D4" stroke-width="2.2" opacity="0.13"
            filter="url(#blur3)"/>
      <path d="M -68,-34 Q -17,-25 34,-42"
            fill="none" stroke="#D0F8E0" stroke-width="1.3" opacity="0.09"
            filter="url(#blur3)"/>
    </g>

    <!-- Inner light band -->
    <polygon points="0,-98 84.9,-49 84.9,49 0,98 -84.9,49 -84.9,-49"
             fill="none" stroke="#B8F4D4" stroke-width="3" opacity="0.13"
             filter="url(#blur8)"/>

    <!-- Crisp inner line -->
    <polygon points="0,-99 85.7,-49.5 85.7,49.5 0,99 -85.7,49.5 -85.7,-49.5"
             fill="none" stroke="#C8F8DC" stroke-width="0.5" opacity="0.22"/>

    <!-- Bright outer rim -->
    <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5"
             fill="none" stroke="#E8FCF2" stroke-width="0.9" opacity="0.55"/>

    <!-- B: bottom rim light — inset stroke, top of stroke bright at bottom -->
    <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5"
             fill="none" stroke="url(#bottomRim)" stroke-width="2.2" opacity="0.9"/>

    <!-- Speculars -->
    <ellipse cx="-40" cy="-47" rx="28" ry="20"
             fill="url(#specHalo)" opacity="0.88"/>
    <circle cx="-40" cy="-47" r="4.8" fill="#FFFFFF" opacity="0.98"/>
    <circle cx="-40" cy="-47" r="1.9" fill="#FFFFFF"/>

    <circle cx="36" cy="46" r="1.4" fill="#FFFFFF" opacity="0.30"/>
    <circle cx="36" cy="46" r="0.6" fill="#FFFFFF" opacity="0.65"/>
  </g>
</svg>