<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0%"   stop-color="#F8EED4"/>
      <stop offset="55%"  stop-color="#EBDCB4"/>
      <stop offset="100%" stop-color="#D6C297"/>
    </radialGradient>

    <radialGradient id="inkWash" cx="0.7" cy="0.75" r="0.6">
      <stop offset="0%"   stop-color="#6B5A3E" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#6B5A3E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6B5A3E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="jadeBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#C4F7DE"/>
      <stop offset="15%"  stop-color="#7FD9A6"/>
      <stop offset="42%"  stop-color="#3F9D74"/>
      <stop offset="75%"  stop-color="#163F2A"/>
      <stop offset="100%" stop-color="#051410"/>
    </linearGradient>

    <radialGradient id="jadeHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#A8EEC4" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#4AA078" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4AA078" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="specHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F6D780"/>
      <stop offset="55%"  stop-color="#C89A3E"/>
      <stop offset="100%" stop-color="#7A5620"/>
    </linearGradient>

    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B83830"/>
      <stop offset="100%" stop-color="#7A1F1A"/>
    </linearGradient>

    <clipPath id="hexClip">
      <polygon points="0,-140 121.2,-70 121.2,70 0,140 -121.2,70 -121.2,-70"/>
    </clipPath>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="jadeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Papier de riz, remplit tout le canvas -->
  <rect width="100%" height="100%" fill="url(#paper)"/>

  <!-- Tache d'encre, coin bas-droite -->
  <ellipse cx="440" cy="390" rx="320" ry="260" fill="url(#inkWash)"/>

  <!-- Montagnes shan shui, très subtiles, en bas -->
  <path d="M 0,390 Q 45,368 100,380 T 200,362 T 305,380 T 410,362
           T 510,378 T 630,368 L 630,500 L 0,500 Z"
        fill="#8A7554" opacity="0.28"/>
  <path d="M 0,420 Q 40,400 95,412 T 195,396 T 295,414 T 395,396
           T 495,412 T 630,402 L 630,500 L 0,500 Z"
        fill="#3E3020" opacity="0.55"/>
  <path d="M 0,448 Q 40,432 95,440 T 195,428 T 295,442 T 395,428
           T 495,440 T 630,434 L 630,500 L 0,500 Z"
        fill="#1A120A" opacity="0.88"/>

  <!-- Bordure fine dorée intérieure -->
  <rect x="14" y="14" width="602" height="472" rx="2" ry="2"
        fill="none" stroke="url(#gold)" stroke-width="0.9" opacity="0.65"/>
  <rect x="20" y="20" width="590" height="460" rx="1" ry="1"
        fill="none" stroke="#8A6538" stroke-width="0.4" opacity="0.4"/>

  <!-- Jade, pivoté 7° -->
  <g transform="translate(315 290) rotate(7)">
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="url(#jadeHalo)"/>

    <polygon points="0,-146 126.4,-73 126.4,73 0,146 -126.4,73 -126.4,-73"
             fill="#1A1208" opacity="0.30" filter="url(#jadeBlur)"
             transform="translate(4 10)"/>

    <polygon points="0,-140 121.2,-70 121.2,70 0,140 -121.2,70 -121.2,-70"
             fill="#04140B"/>

    <polygon points="0,-136 117.8,-68 117.8,68 0,136 -117.8,68 -117.8,-68"
             fill="url(#jadeBody)"/>

    <g clip-path="url(#hexClip)">
      <ellipse cx="-42" cy="-58" rx="68" ry="46"
               fill="#E5FCEF" opacity="0.52" filter="url(#softBlur)"/>
      <ellipse cx="52" cy="72" rx="85" ry="58"
               fill="#020D07" opacity="0.62" filter="url(#softBlur)"/>
      <path d="M -105,18 Q -35,-18 25,32 T 105,22"
            fill="none" stroke="#C0F0D4" stroke-width="2.6" opacity="0.16"
            filter="url(#softBlur)"/>
      <path d="M -85,-42 Q -20,-28 55,-55"
            fill="none" stroke="#D0F8E0" stroke-width="1.6" opacity="0.10"
            filter="url(#softBlur)"/>
    </g>

    <polygon points="0,-126 109.1,-63 109.1,63 0,126 -109.1,63 -109.1,-63"
             fill="none" stroke="#B8F4D4" stroke-width="3.4" opacity="0.15"
             filter="url(#jadeBlur)"/>
    <polygon points="0,-127 110,-63.5 110,63.5 0,127 -110,63.5 -110,-63.5"
             fill="none" stroke="#C8F8DC" stroke-width="0.7" opacity="0.24"/>

    <polygon points="0,-136 117.8,-68 117.8,68 0,136 -117.8,68 -117.8,-68"
             fill="none" stroke="#E8FCF2" stroke-width="1.4" opacity="0.85"/>

    <polygon points="0,-136 117.8,-68 117.8,68 0,136 -117.8,68 -117.8,-68"
             fill="none" stroke="#FFC97A" stroke-width="1.7" opacity="0.42"
             transform="translate(1 2)"/>

    <ellipse cx="-52" cy="-60" rx="34" ry="24" fill="url(#specHalo)"/>
    <circle cx="-52" cy="-60" r="6.5" fill="#FFFFFF" opacity="0.98"/>
    <circle cx="-52" cy="-60" r="2.5" fill="#FFFFFF"/>

    <circle cx="52" cy="74" r="2.8" fill="#FFFFFF" opacity="0.32"/>
    <circle cx="52" cy="74" r="1.1" fill="#FFFFFF" opacity="0.60"/>
  </g>

  <!-- Titre -->
  <text x="315" y="86" text-anchor="middle"
        font-family="'Playfair Display','Didot','Bodoni 72',Georgia,serif"
        font-size="48" font-weight="900"
        fill="#100904" letter-spacing="9">JADE GARDEN</text>

  <text x="315" y="110" text-anchor="middle"
        font-family="Georgia,serif"
        font-size="10"
        fill="#5A4028" letter-spacing="6">A CONTEMPLATIVE MATCH-3</text>

  <line x1="60"  y1="130" x2="295" y2="130" stroke="url(#gold)" stroke-width="0.7" opacity="0.85"/>
  <line x1="335" y1="130" x2="570" y2="130" stroke="url(#gold)" stroke-width="0.7" opacity="0.85"/>
  <polygon points="315,126 319,130 315,134 311,130" fill="url(#gold)"/>

  <!-- Sceau rouge -->
  <g transform="translate(572 448)">
    <rect x="-26" y="-26" width="52" height="52" rx="3" ry="3" fill="url(#seal)"/>
    <rect x="-22" y="-22" width="44" height="44" rx="1.5" ry="1.5"
          fill="none" stroke="#5A1410" stroke-width="0.7" opacity="0.6"/>
    <text x="0" y="11" text-anchor="middle"
          font-family="'Songti SC','STSong','PingFang SC',serif"
          font-size="34" font-weight="900"
          fill="#F4E4C8" opacity="0.96">玉</text>
  </g>
</svg>