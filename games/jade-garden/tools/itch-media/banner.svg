<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#06080F"/>
      <stop offset="55%"  stop-color="#0A0D1C"/>
      <stop offset="100%" stop-color="#0E0B16"/>
    </linearGradient>

    <linearGradient id="jadeBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#D4FBE4"/>
      <stop offset="20%"  stop-color="#8FE8B0"/>
      <stop offset="55%"  stop-color="#4AA87A"/>
      <stop offset="85%"  stop-color="#1A4A30"/>
      <stop offset="100%" stop-color="#061A12"/>
    </linearGradient>

    <radialGradient id="jadeHalo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#8FE8B0" stop-opacity="0.48"/>
      <stop offset="35%"  stop-color="#3A9A70" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3A9A70" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="specHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C89A3E"/>
      <stop offset="50%"  stop-color="#F4D680"/>
      <stop offset="100%" stop-color="#8A6538"/>
    </linearGradient>

    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B83830"/>
      <stop offset="100%" stop-color="#7A1F1A"/>
    </linearGradient>

    <clipPath id="hexClip">
      <polygon points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31"/>
    </clipPath>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="midBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Ciel indigo, remplit tout le canvas -->
  <rect width="100%" height="100%" fill="url(#sky)"/>

  <!-- Quelques étoiles -->
  <g fill="#F4E4C8">
    <circle cx="120" cy="52"  r="0.9" opacity="0.55"/>
    <circle cx="345" cy="94"  r="0.6" opacity="0.35"/>
    <circle cx="580" cy="42"  r="0.7" opacity="0.42"/>
    <circle cx="845" cy="68"  r="0.8" opacity="0.50"/>
    <circle cx="275" cy="140" r="0.5" opacity="0.28"/>
  </g>

  <!-- Portail de lune : un simple cercle fin -->
  <g transform="translate(700 200)">
    <circle r="158" fill="none" stroke="#1A1410" stroke-width="0.6" opacity="0.55"/>
  </g>

  <!-- Halo du jade -->
  <ellipse cx="700" cy="200" rx="260" ry="240" fill="url(#jadeHalo)"/>

  <!-- Jade -->
  <g transform="translate(700 200)">
    <polygon points="0,-66 57.2,-33 57.2,33 0,66 -57.2,33 -57.2,-33"
             fill="#04140B"/>

    <polygon points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31"
             fill="url(#jadeBody)"/>

    <g clip-path="url(#hexClip)">
      <ellipse cx="-18" cy="-26" rx="34" ry="22"
               fill="#E8FDF0" opacity="0.55" filter="url(#softBlur)"/>
      <ellipse cx="22" cy="32" rx="40" ry="26"
               fill="#020C07" opacity="0.55" filter="url(#softBlur)"/>
    </g>

    <polygon points="0,-55 47.6,-27.5 47.6,27.5 0,55 -47.6,27.5 -47.6,-27.5"
             fill="none" stroke="#B8F4D4" stroke-width="2" opacity="0.20"
             filter="url(#midBlur)"/>

    <polygon points="0,-62 53.7,-31 53.7,31 0,62 -53.7,31 -53.7,-31"
             fill="none" stroke="#E8FCF2" stroke-width="1.1" opacity="0.85"/>

    <ellipse cx="-22" cy="-28" rx="16" ry="11" fill="url(#specHalo)"/>
    <circle cx="-22" cy="-28" r="3" fill="#FFFFFF" opacity="0.98"/>
    <circle cx="-22" cy="-28" r="1.2" fill="#FFFFFF"/>
    <circle cx="22" cy="32" r="1.3" fill="#FFFFFF" opacity="0.32"/>
  </g>

  <!-- Filet vertical doré -->
  <line x1="72" y1="148" x2="72" y2="262" stroke="url(#gold)" stroke-width="0.8" opacity="0.65"/>

  <!-- Titre -->
  <text x="98" y="200"
        font-family="'Playfair Display','Didot','Bodoni 72',Georgia,serif"
        font-size="54" font-weight="900"
        fill="#F4E4C8" letter-spacing="4">JADE</text>

  <text x="98" y="256"
        font-family="'Playfair Display','Didot','Bodoni 72',Georgia,serif"
        font-size="54" font-weight="900"
        fill="#F4E4C8" letter-spacing="4">GARDEN</text>

  <line x1="98" y1="278" x2="300" y2="278" stroke="url(#gold)" stroke-width="0.7" opacity="0.70"/>

  <text x="98" y="300"
        font-family="Georgia,serif"
        font-size="10.5"
        fill="#B8945A" letter-spacing="6">A CONTEMPLATIVE MATCH-3</text>

  <!-- Sceau rouge -->
  <g transform="translate(908 352)">
    <rect x="-22" y="-22" width="44" height="44" rx="2" ry="2"
          fill="url(#seal)" opacity="0.94"/>
    <rect x="-18" y="-18" width="36" height="36" rx="1.5" ry="1.5"
          fill="none" stroke="#5A1410" stroke-width="0.6" opacity="0.55"/>
    <text x="0" y="10" text-anchor="middle"
          font-family="'Songti SC','STSong','PingFang SC',serif"
          font-size="28" font-weight="900"
          fill="#F4E4C8" opacity="0.95">玉</text>
  </g>
</svg>