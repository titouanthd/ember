[package]
name = "bore-inc"
version.workspace = true
edition.workspace = true

[dependencies]
ember-core.workspace = true
ember-stdlib.workspace = true
ember.workspace = true
ember-input.workspace = true
ember-servers.workspace = true
# Decodes the built-in sprite sheet (PNG only; macroquad already uses it).
image = { version = "0.25", default-features = false, features = ["png"] }
glam.workspace = true
serde.workspace = true
ron.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy.workspace = true

[dev-dependencies]
pollster = "0.4"

[lib]
name = "bore_inc"
path = "src/lib.rs"

[[bin]]
name = "bore-inc"
path = "src/main.rs"