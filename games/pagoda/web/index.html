<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0712">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pagoda</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b0712;
            color: #f4ecff;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            position: fixed;
            inset: 0;
            touch-action: none;
        }
        #glcanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0b0712;
            outline: none;
            touch-action: none;
        }
        #error {
            display: none;
            padding: 2rem;
            text-align: center;
        }
        #error h2 { color: #ffd166; }

        /* Landscape is the comfortable orientation. In portrait the
           full game still fits (letterboxed), so this is a hint only:
           it never blocks taps and fades away on its own. */
        #rotate-hint {
            position: fixed;
            left: 50%;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: none;
            padding: 7px 14px;
            border: 1px solid rgba(240, 200, 110, 0.45);
            border-radius: 999px;
            background: rgba(10, 7, 18, 0.72);
            color: #f4ecff;
            font-size: 11px;
            letter-spacing: 0.14em;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
        }
        @media (orientation: portrait) and (max-width: 820px) {
            #rotate-hint {
                display: block;
                animation: rotate-hint 8s ease forwards;
            }
        }
        @keyframes rotate-hint {
            0% { opacity: 0; }
            8% { opacity: 1; }
            72% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="rotate-hint">ROTATE FOR A BIGGER TOWER</div>
    <div id="error">
        <h2>Sorry — this browser cannot run Pagoda.</h2>
        <p>It needs WebGL2. Try a recent version of Chrome, Firefox, or Safari.</p>
    </div>

    <script src="mq_js_bundle.js"></script>
    <script>
        if (typeof load !== 'function') {
            document.getElementById('glcanvas').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        } else {
            // Macroquad binds keyboard events to the canvas, so it must
            // own focus for Space and Enter. Touch and mouse are mapped
            // by macroquad itself; focus here only helps keyboards.
            const canvas = document.getElementById('glcanvas');
            const focusCanvas = () => canvas.focus({ preventScroll: true });
            focusCanvas();
            canvas.addEventListener('pointerdown', focusCanvas);
            canvas.addEventListener('touchstart', focusCanvas, { passive: true });
            canvas.addEventListener('contextmenu', (event) => event.preventDefault());
            document.addEventListener('gesturestart', (event) => event.preventDefault());
            load("pagoda.wasm");
        }
    </script>
</body>
</html>
